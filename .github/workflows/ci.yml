# Lint and unit tests for the Next.js app on every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: web

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
        env:
          # Build-time placeholders; real values come from deployment env.
          DIRECTUS_URL: http://127.0.0.1:8055
          DIRECTUS_READ_TOKEN: ci-placeholder-not-used-at-runtime
          REVALIDATE_SECRET: ci-placeholder-not-used-at-runtime
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
